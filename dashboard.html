<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 
</head>
<body>

<div class="dashboard-container">
    
    <header class="dashboard-header">
        <div class="logo-area">
            <span class="logo-empresa">MIND SYSTEM</span>
        </div>
        <div class="user-info">
            <span class="nome-usuario">[NOME DO USUÁRIO]</span>
            <i class="fas fa-user user-icon"></i>
        </div>
        <div class="version-area">
            <span class="versao">VERSÃO</span>
        </div>
    </header>

    <nav class="tab-navigation">
        <button class="tab-item active">Clientes</button>
        <button class="tab-item">Pedidos</button>
        <button class="tab-item">Relatórios</button>
        <button class="tab-item">Conexão</button>
    </nav>

    <main class="main-content">
        
        <section class="indicators-area">
            <h2 class="section-title">Indicadores</h2>
            
            <div class="indicator-cards">
                <div class="indicator-card">
                    <p class="indicator-label">Vendas (crescimento)</p>
                    <div class="indicator-value">0%</div>
                </div>
                <div class="indicator-card">
                    <p class="indicator-label">Vendas (total)</p>
                    <div class="indicator-value">0%</div>
                </div>
                <div class="indicator-card">
                    <p class="indicator-label">Volume (cx)</p>
                    <div class="indicator-value">0%</div>
                </div>
            </div>
        </section>

        <aside class="period-selector-area">
            <label for="periodo-select" class="selector-label">Período:</label>
            <select id="periodo-select" class="period-select">
                <option value="JAN/2025" selected>JAN/2025</option>
                <option value="FEV/2025">FEV/2025</option>
                <option value="MAR/2025">MAR/2025</option>
                <option value="ABR/2025">ABR/2025</option>
                <option value="MAI/2025">MAI/2025</option>
                <option value="JUN/2025">JUN/2025</option>
                <option value="JUL/2025">JUL/2025</option>
                <option value="AGO/2025">AGO/2025</option>
                <option value="SET/2025">SET/2025</option>
                <option value="OUT/2025">OUT/2025</option>
                <option value="NOV/2025">NOV/2025</option>
                <option value="DEZ/2025">DEZ/2025</option>
            </select>
        </aside>

    </main>

</div>

</body>
</html>
